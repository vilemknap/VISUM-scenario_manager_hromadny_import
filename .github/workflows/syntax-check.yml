name: syntax-check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pycompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m py_compile visum_bulk_replace_geometry.py
